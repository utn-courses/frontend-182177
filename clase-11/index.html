<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Nova Digital</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
          aria-controls="menu" aria-expanded="false" aria-label="Abrir navegación">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <!-- nav-item: representa un elemento del menú -->
            <li class="nav-item">
              <!-- nav-link: aplica estilos a un enlace de navegación -->
              <a class="nav-link" href="#inicio">Inicio</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#servicios">Servicios</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#contacto">Contacto</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section id="inicio" class="banner bg-primary text-white py-5">
      <div class="container py-5 text-center">
        <h1> Llevamos tu negocio al siguiente nivel</h1>
        <p> Creamos soluciones digitales para empresas que quieren crecer.</p>
      </div>
    </section>
    <section id="servicios" class="container py-5">
      <div class="text-center mb-5">
        <h2 class="fw-bold">Nuestros servicios</h2>
        <p class="text-secondary"> Herramientas digitales para impulsar tu empresa.</p>
      </div>
    </section>
  </main>

  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
</body>

</html>
