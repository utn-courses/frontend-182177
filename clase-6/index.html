<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | NFT preview card component</title>
  <link rel="stylesheet" href="styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
  <article>
    <img class="nft" src="./images/image-equilibrium.jpg" alt="imagen ilustrativa de NFT">
    <h2>Equilibrium #3429</h2>
    <p class="description">Our Equilibrium collection promotes balance and calm.</p>

    <div class="data-nft">
      <div class="price">
        <img src="./images/icon-ethereum.svg" alt="icono de ethereum">
        <strong>0.041 ETH</strong>
      </div>
      <div class="time">
        <img src="./images/icon-clock.svg" alt="icono de reloj">
        <span>3 days left</span>
      </div>
    </div>

    <hr>

    <div class="avatar">
      <img src="./images/image-avatar.png" alt="imagen de usuario">
      <p>Creation of <strong>Jules Wyvern</strong></p>
    </div>

  </article>
</body>

</html>
